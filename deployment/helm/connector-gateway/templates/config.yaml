{{- include "gateway.validate" . -}}
{{- $v := .Values }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $v.name }}
  namespace: {{ .Release.Namespace }}
data:
  {{- if $v.egress.enabled }}
  {{- $p := $v.egress.peer }}
  {{- $name := include "gateway.peerName" . }}
  peer-ca.crt: |
    {{- $p.caCert | trim | nindent 4 }}
  envoy.yaml: |
    static_resources:
      listeners:
        - name: egress
          address: {socket_address: {address: 0.0.0.0, port_value: {{ $v.egress.port }}}}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress
                    {{- include "gateway.accessLog" (printf "egress:%s" $p.name) | nindent 20 }}
                    route_config:
                      virtual_hosts:
                        - name: {{ $p.name | quote }}
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route: {cluster: peer, timeout: 30s, host_rewrite_literal: {{ $name | quote }}}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          suppress_envoy_headers: true
      clusters:
        - name: peer
          type: STATIC
          connect_timeout: 5s
          load_assignment:
            cluster_name: peer
            endpoints:
              - lb_endpoints:
                  - endpoint: {address: {socket_address: {address: {{ $p.address | quote }}, port_value: {{ $p.port }}}}}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              {{- if not (regexMatch "^[0-9.]+$" $name) }}
              sni: {{ $name | quote }}
              {{- end }}
              common_tls_context:
                tls_params: {tls_minimum_protocol_version: TLSv1_2}
                validation_context:
                  trusted_ca: {filename: /etc/gateway/peer-ca.crt}
                  match_typed_subject_alt_names:
                    - san_type: {{ if regexMatch "^[0-9.]+$" $name }}IP_ADDRESS{{ else }}DNS{{ end }}
                      matcher: {exact: {{ $name | quote }}}
  {{- else }}
  envoy.yaml: |
    static_resources:
      listeners:
        - name: ingress
          address: {socket_address: {address: 0.0.0.0, port_value: {{ $v.ingress.port }}}}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_params: {tls_minimum_protocol_version: TLSv1_2}
                    tls_certificates:
                      - certificate_chain: {filename: /etc/tls/tls.crt}
                        private_key: {filename: /etc/tls/tls.key}
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    use_remote_address: true
                    {{- include "gateway.accessLog" "ingress" | nindent 20 }}
                    route_config:
                      virtual_hosts:
                        - name: upstream
                          domains: ["*"]
                          routes:
                            - match: {prefix: "/"}
                              route: {cluster: upstream, timeout: 30s, host_rewrite_literal: {{ printf "%s.%s.svc.cluster.local" $v.ingress.upstream.name .Release.Namespace | quote }}}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          suppress_envoy_headers: true
      clusters:
        - name: upstream
          type: STRICT_DNS
          connect_timeout: 2s
          load_assignment:
            cluster_name: upstream
            endpoints:
              - lb_endpoints:
                  - endpoint: {address: {socket_address: {address: {{ $v.ingress.upstream.name | quote }}, port_value: {{ $v.ingress.upstream.port }}}}}
  {{- end }}

# Images must already be admitted digests, including Envoy and injected sidecars.
images:
  guard: {repository: ghcr.io/fune5tiatlas/facis-zero-trust-demonstrator/guard, digest: ""}
  policy: {repository: ghcr.io/fune5tiatlas/facis-zero-trust-demonstrator/policy-evaluator, digest: ""}
  envoy: {repository: ghcr.io/fune5tiatlas/facis-zero-trust-demonstrator/envoy, digest: ""}
trustDomain: zone-b.trust.invalid
participantServiceAccount: ztd-participant
resourceName: ztd-protected-resource
resourcePort: 8080
nodeSelector: {}
podAnnotations: {}
config:
  issuer: ""
  jwks_url: ""
  audience: ""
  published_base_url: ""
  peer_zone: zone-b
  policy_url: http://ztd-policy-evaluator:8080
  store_url: http://ztd-token-store:8080
  allowed_callers: []
  scope_tenants: {"report:read": report-read, "report:summary": report-summary}
policyRevision: m3-v1
# Added to component-specific service and DNS rules; use only explicit dependency/control peers.
networkPolicy:
  egress: []
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {memory: 256Mi}

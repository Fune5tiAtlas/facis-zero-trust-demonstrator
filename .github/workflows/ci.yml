name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Go tests
    uses: eclipse-xfsc/dev-ops/.github/workflows/go-test.yml@main

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run golangci-lint
        run: |
          if [ ! -f go.mod ]; then
            echo 'No Go module at the repository root yet - nothing to lint.'
            exit 0
          fi
          docker run --rm -v "$PWD:/app" -w /app \
            golangci/golangci-lint:v2.13.2 golangci-lint run ./...

  images:
    name: Image build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build, assert Linux and scan every image
        run: |
          shopt -s nullglob
          dockerfiles=(deployment/docker/*/Dockerfile)
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo 'No container build context yet - nothing to build.'
            exit 0
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            context=$(dirname "$dockerfile")
            image="ci/$(basename "$context"):${{ github.sha }}"

            docker build --platform linux/amd64 -t "$image" "$context"

            # ZT-13 requires Linux images; assert it rather than trust the Dockerfile.
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
            echo "$image platform: $platform"
            if [ "$platform" != "linux/amd64" ]; then
              echo "::error::$image is $platform, ZT-13 requires linux/amd64"
              exit 1
            fi

            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0 image --exit-code 1 --severity HIGH,CRITICAL "$image"
          done

  charts:
    name: Chart lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint and render every chart
        run: |
          shopt -s nullglob
          charts=(deployment/helm/*/Chart.yaml)
          if [ ${#charts[@]} -eq 0 ]; then
            echo 'No chart yet - nothing to lint.'
            exit 0
          fi
          for chart in "${charts[@]}"; do
            directory=$(dirname "$chart")
            helm lint "$directory"
            helm template "$directory" >/dev/null
          done
